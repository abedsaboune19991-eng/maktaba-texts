name: Build reading texts (Amiri)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/readpdf.py, scripts/read_*.py, .github/workflows/read.yml]

permissions:
  contents: write

concurrency:
  group: read
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts
            manifest.json
            library.json
            read/index.json
          sparse-checkout-cone-mode: false
      - run: pip install -q pdfminer.six==20260107 || pip install -q pdfminer.six
      - id: plan
        run: cd scripts && PYTHONPATH=. python3 -c "import os;os.chdir('..');import sys;sys.path.insert(0,'scripts');import read_plan;read_plan.main()"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.has_work == 'true'
        with:
          name: rplan
          path: work/

  process:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: rplan
          path: work/
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pip install -q pdfminer.six==20260107 || pip install -q pdfminer.six
      - name: Extract reading text
        env:
          TIME_BUDGET: "18000"
        run: cd scripts && python3 read_process.py ../work/rshard_${{ matrix.shard }}.json ../out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rout-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore

  merge:
    needs: [plan, process]
    if: always() && needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: rout-*
          path: results/
      - name: Merge and commit
        run: |
          git config user.name "maktaba-bot"
          git config user.email "maktaba-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/read_merge.py results
            git add read
            git diff --cached --quiet && exit 0
            git commit -q -m "تحديث نصوص القراءة بالخط الأميري"
            git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
