name: Font survey

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: python3 scripts/font_survey.py
        env:
          PYTHONPATH: scripts
      - name: Push survey
        run: |
          cd survey && git init -q && git checkout -q -b survey
          git config user.name "maktaba-bot" && git config user.email "maktaba-bot@users.noreply.github.com"
          git add . && git commit -q -m survey
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" survey
