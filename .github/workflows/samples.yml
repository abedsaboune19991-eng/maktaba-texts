name: Fetch sample PDFs

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "معرّفات الكتب مفصولة بفواصل"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts
      - name: Download
        run: python3 scripts/fetch_samples.py "${{ github.event.inputs.ids }}" || true
        env:
          PYTHONPATH: scripts
      - name: Push to samples branch
        run: |
          cd samples
          git init -q && git checkout -q -b samples
          git config user.name "maktaba-bot" && git config user.email "maktaba-bot@users.noreply.github.com"
          git add . && git commit -q -m "samples"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" samples
